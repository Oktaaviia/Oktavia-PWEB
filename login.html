<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PixelStudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-wrapper">
    <article class="auth-card">

      <header class="auth-header">
        <a href="index.html" class="logo auth-logo">PixelStudio</a>
        <h1>Selamat Datang Kembali</h1>
        <p>Masuk ke akun Anda untuk melanjutkan</p>
      </header>

      <form id="login-form" novalidate>
        <fieldset>
          <legend>Informasi Login</legend>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
              placeholder="nama@email.com" autocomplete="email">
            <span class="error-msg" id="error-email"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-pw-wrap">
              <input type="password" id="password" name="password"
                placeholder="Masukkan password" autocomplete="current-password">
              <button type="button" id="toggle-pw" class="toggle-pw" aria-label="Lihat password">👁</button>
            </div>
            <span class="error-msg" id="error-password"></span>
          </div>

          <span class="error-msg" id="error-login" style="display:block;margin-bottom:12px"></span>

          <button type="submit" class="btn-full">Masuk</button>
        </fieldset>
      </form>

      <footer class="auth-footer">
        <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
        <p style="margin-top:8px">
          <a href="index.html" class="back-link">← Kembali ke Beranda</a>
        </p>
        <details class="demo-details">
          <summary>Akun Demo</summary>
          <p class="auth-hint">
            <strong>Admin:</strong> admin@pixel.com / admin123<br>
            <strong>Customer:</strong> customer@pixel.com / cust123
          </p>
        </details>
      </footer>

    </article>
  </main>

  <output id="notification" role="status" aria-live="polite"></o>
  <script src="script.js"></script>
</body>
</html>
